<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Form</title>
    <link rel="stylesheet" href="form.css">
    <link rel="icon" href="favicon.png">
    <script src="form.js" defer></script>
</head>
<body>
    <main id="wrapper">
        <h1><strong>Event Ticket</strong></h1>
        <form id="ticketForm">
            <div class="field" class="first">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required>
            </div>

            <div class="field" id="last">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required>
            </div>

            <div class="field" id="electronicMail">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>

            <div class="field" id="ticketType">
                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option>Choose One</option>
                    <option>Student</option>
                    <option>Guest</option>
                </select>
            </div>

            <div class="field" id="date">
                <label for="eventDate">Date</label>
                <input id="eventDate" name="eventDate" type="date" required>
            </div>

            <div class="field" id="code">
                <label for="VerificationCode" id="codeType" >placeholder</label>
                <input id="verificationCode" name="verificationCode" type="text">
            </div>

            <button type="submit" id="submit">Create Ticket</button>

            <div id="output"></div>
        </form>
    </main>
</body>
</html>
